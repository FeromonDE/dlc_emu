name: Build DLC modules with diagnostic log in download

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'ps5/**'
      - 'msbuild/pemd/**'
      - 'Makefile'
      - 'build.sh'
      - 'dlc_emu.example.ini'
      - '.github/workflows/ps5.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: dlc-download-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Verify diagnostic log path
        run: python3 tools/patch_download_log.py --check
      - name: Checkout public SDK recipes
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/pacbrew-repo
          path: _ci/pacbrew-repo
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang-18 cmake curl git \
            libarchive-tools libtool lld-18 makepkg meson \
            pacman-package-manager pkg-config python3 zip
      - name: Install public PS5 Payload SDK
        working-directory: _ci/pacbrew-repo/sdk
        run: |
          set -euo pipefail
          makepkg --nodeps -c -f
          staging="$(mktemp -d)"
          bsdtar -xf ./ps5-payload-sdk-*.pkg.tar.* -C "$staging"
          test -f "$staging/opt/ps5-payload-sdk/toolchain/prospero.mk"
          sudo mkdir -p /opt/ps5-payload-sdk
          sudo cp -a "$staging/opt/ps5-payload-sdk/." /opt/ps5-payload-sdk/
          rm -rf "$staging"
      - name: Install public PS5 libc++ headers
        working-directory: _ci/pacbrew-repo/libcxx
        run: |
          set -euo pipefail
          makepkg --nodeps -c -f
          staging="$(mktemp -d)"
          bsdtar -xf ./ps5-payload-libcxx-*.pkg.tar.* -C "$staging"
          test -d "$staging/opt/ps5-payload-sdk/target/include/c++/v1"
          sudo cp -a "$staging/opt/ps5-payload-sdk/." /opt/ps5-payload-sdk/
          rm -rf "$staging"
      - name: Build and verify all three modules, both variants
        run: ./build.sh
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
      - name: Package modules
        run: |
          set -euo pipefail
          mkdir -p release
          staging="$(mktemp -d)"
          for variant in nolog log; do
            mkdir -p "$staging/$variant"
            for module in libSceAppContent libSceGameUpdate libSceNpEntitlementAccess; do
              test -s "out/payload-sdk/$variant/$module.sprx"
              cp "out/payload-sdk/$variant/$module.sprx" "$staging/$variant/"
            done
          done
          cp dlc_emu.example.ini "$staging/"
          (cd "$staging" && sha256sum log/*.sprx nolog/*.sprx > SHA256SUMS)
          (cd "$staging" && zip -9 -r "$GITHUB_WORKSPACE/release/dlc_emu_download.zip" .)
          rm -rf "$staging"
      - uses: actions/upload-artifact@v4
        with:
          name: dlc_emu_download
          path: release/dlc_emu_download.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re; from pathlib import Path; print(re.search(r"#define SCE_DLC_EMU_VERSION \"([^\"]+)\"", Path("src/dlc_modules/dlc_config.h").read_text()).group(1))')
          tag="download-${version}-${SOURCE_SHA:0:7}"
          printf 'DLC emu %s. Diagnostic modules are in `log/`; their shared log is `/download/dlc_emu.log`.\n\nThe archive also includes `nolog/` and an example configuration. Source: %s\n' "$version" "$SOURCE_SHA" > release-notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber release/dlc_emu_download.zip
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
              --title "DLC emu $version (/download)" --notes-file release-notes.md \
              release/dlc_emu_download.zip
          fi
